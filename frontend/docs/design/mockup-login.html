<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>에쓰푸드몰 판매 상태 자동화 — 로그인</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f4f4f4;--surface:#fff;--surface2:#f8f8f8;--surface3:#efefef;
  --border:rgba(0,0,0,0.08);--border2:rgba(0,0,0,0.14);
  --text:#1a1917;--text2:#6b6960;--text3:#9c9a8e;
  --teal:#c0000a;--teal-bg:#fdecea;--teal-mid:#e8000d;
  --pos:#0f6e56;--pos-bg:#e1f5ee;--pos-mid:#1d9e75;
  --coral:#993c1d;--coral-bg:#faece7;--coral-mid:#d85a30;
  --r-sm:6px;--r-md:8px;--r-lg:12px;--r-xl:16px;
}
body{font-family:'Apple SD Gothic Neo','Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:15px;line-height:1.6;display:flex;flex-direction:column;}

/* 헤더 — 대시보드와 동일 구조 */
header{background:var(--surface);border-bottom:0.5px solid var(--border);padding:0 1.25rem;height:52px;display:flex;align-items:center;flex-shrink:0;}
.logo{font-size:17px;font-weight:600;letter-spacing:-.3px;}
.logo em{color:var(--teal-mid);font-style:normal;}

/* 페이지 중앙 정렬 */
main{flex:1;display:flex;align-items:center;justify-content:center;padding:2rem 1rem;}

/* 로그인 카드 */
.login-card{background:var(--surface);border:0.5px solid var(--border);border-radius:var(--r-xl);padding:2rem;width:100%;max-width:400px;box-shadow:0 4px 24px rgba(0,0,0,.06);}

/* 카드 상단 */
.card-top{text-align:center;margin-bottom:1.75rem;}
.card-icon{width:44px;height:44px;background:var(--teal-bg);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto .9rem;}
.card-icon svg{width:20px;height:20px;color:var(--teal-mid);}
.card-title{font-size:16px;font-weight:600;margin-bottom:5px;}
.card-desc{font-size:12px;color:var(--text3);line-height:1.7;}

/* 스텝 인디케이터 */
.steps{display:flex;align-items:center;justify-content:center;gap:0;margin-bottom:1.75rem;}
.step{display:flex;align-items:center;gap:6px;}
.step-num{width:22px;height:22px;border-radius:50%;font-size:10px;font-weight:600;display:flex;align-items:center;justify-content:center;border:1.5px solid var(--border2);background:var(--surface2);color:var(--text3);flex-shrink:0;transition:all .2s;}
.step-lbl{font-size:11px;color:var(--text3);white-space:nowrap;transition:color .2s;}
.step.active .step-num{background:var(--teal-mid);border-color:var(--teal-mid);color:#fff;}
.step.active .step-lbl{color:var(--text);font-weight:500;}
.step.done .step-num{background:var(--pos-mid);border-color:var(--pos-mid);color:#fff;}
.step.done .step-lbl{color:var(--text2);}
.step-line{width:32px;height:1px;background:var(--border2);margin:0 6px;flex-shrink:0;}

/* 섹션 전환 */
.section{display:none;}
.section.active{display:block;}

/* 입력 폼 */
.form-row{margin-bottom:.8rem;}
.form-row label{display:block;font-size:11px;color:var(--text2);margin-bottom:4px;font-weight:500;letter-spacing:.1px;}
.form-row input{width:100%;height:40px;padding:0 12px;border:0.5px solid var(--border2);border-radius:var(--r-md);font-size:13px;background:var(--surface2);color:var(--text);outline:none;font-family:inherit;transition:border-color .15s,background .15s;}
.form-row input:focus{border-color:var(--teal-mid);background:var(--surface);}
.form-row input::placeholder{color:var(--text3);}
.form-row input:disabled{opacity:.38;cursor:default;background:var(--surface3);}
.form-hint{font-size:11px;color:var(--text3);margin-top:4px;}

/* OTP 전용 큰 입력 */
.otp-input{font-size:24px!important;font-weight:600!important;letter-spacing:.25em!important;text-align:center!important;height:56px!important;border-radius:var(--r-lg)!important;}
.otp-input:focus{border-color:var(--teal-mid)!important;}

/* 타이머 + 재발송 */
.timer-row{display:flex;align-items:center;justify-content:space-between;margin:.4rem 0 .85rem;}
.timer-label{font-size:12px;color:var(--text2);}
.timer-val{font-weight:600;color:var(--teal-mid);font-variant-numeric:tabular-nums;}
.timer-val.warn{color:var(--coral-mid);}
.resend-btn{font-size:11px;color:var(--teal-mid);background:none;border:none;cursor:pointer;font-family:inherit;text-decoration:underline;text-underline-offset:2px;padding:0;transition:opacity .15s;}
.resend-btn:hover:not(:disabled){opacity:.7;}
.resend-btn:disabled{color:var(--text3);text-decoration:none;cursor:default;}

/* 오류 메시지 박스 */
.err-box{display:none;background:var(--coral-bg);border:0.5px solid rgba(153,60,29,.2);border-radius:var(--r-md);padding:10px 12px;font-size:12px;color:var(--coral);margin-bottom:.85rem;line-height:1.5;align-items:flex-start;gap:7px;}
.err-box.show{display:flex;}
.err-box svg{width:13px;height:13px;flex-shrink:0;margin-top:1px;}

/* 성공 알림 박스 */
.ok-box{display:none;background:var(--pos-bg);border:0.5px solid rgba(15,110,86,.2);border-radius:var(--r-md);padding:10px 12px;font-size:12px;color:var(--pos);margin-bottom:.85rem;line-height:1.5;align-items:flex-start;gap:7px;}
.ok-box.show{display:flex;}
.ok-box svg{width:13px;height:13px;flex-shrink:0;margin-top:1px;}

/* 기본 버튼 */
.primary-btn{width:100%;height:42px;background:#c8000b;color:#fff;border:none;border-radius:var(--r-md);font-size:14px;font-weight:500;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:6px;transition:opacity .15s,transform .1s;margin-top:.2rem;}
.primary-btn:hover:not(:disabled){opacity:.88;}
.primary-btn:active:not(:disabled){transform:scale(.98);}
.primary-btn:disabled{opacity:.4;cursor:default;}
.primary-btn.loading{opacity:.65;cursor:default;}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{animation:spin .7s linear infinite;}

/* 이전으로 */
.back-row{display:flex;justify-content:center;margin-top:1rem;}
.back-btn{font-size:11px;color:var(--text3);background:none;border:none;cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:3px;padding:4px 0;transition:color .12s;}
.back-btn:hover{color:var(--text2);}

/* 카드 하단 */
.card-footer{margin-top:1.5rem;padding-top:1.25rem;border-top:0.5px solid var(--border);text-align:center;font-size:11px;color:var(--text3);line-height:1.8;}

/* 토스트 */
.toast{position:fixed;bottom:1.5rem;right:1.25rem;left:1.25rem;max-width:360px;margin:0 auto;background:#1a1917;color:#f4f3ef;font-size:12px;padding:10px 16px;border-radius:var(--r-lg);z-index:300;opacity:0;transform:translateY(8px);transition:opacity .2s,transform .2s;pointer-events:none;line-height:1.5;text-align:center;}
@media(min-width:480px){.toast{left:auto;text-align:left;max-width:320px;}}
.toast.show{opacity:1;transform:translateY(0);}
.toast.err{background:var(--coral-mid);}

@media(max-width:480px){
  .login-card{padding:1.5rem 1.25rem;}
  .step-lbl{display:none;}
  .step-line{width:20px;}
}
</style>
</head>
<body>

<header>
  <div class="logo">에쓰푸드몰 <em>판매 상태 자동화</em></div>
</header>

<main>
  <div class="login-card">

    <!-- 카드 상단 -->
    <div class="card-top">
      <div class="card-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
      </div>
      <div class="card-title">로그인</div>
      <div class="card-desc">회사 이메일로 인증 후 이용할 수 있어요</div>
    </div>

    <!-- 스텝 인디케이터 -->
    <div class="steps">
      <div class="step active" id="step1-ind">
        <div class="step-num" id="dot1">1</div>
        <span class="step-lbl">이메일 입력</span>
      </div>
      <div class="step-line"></div>
      <div class="step" id="step2-ind">
        <div class="step-num" id="dot2">2</div>
        <span class="step-lbl">인증번호 확인</span>
      </div>
    </div>

    <!-- ── STEP 1: 이메일 입력 ── -->
    <div class="section active" id="sec1">
      <div class="err-box" id="err1">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="8" cy="8" r="6"/><line x1="8" y1="5.5" x2="8" y2="8.5"/><circle cx="8" cy="11" r=".6" fill="currentColor" stroke="none"/></svg>
        <span id="err1-text"></span>
      </div>

      <div class="form-row">
        <label for="email">이메일</label>
        <input
          type="email" id="email"
          placeholder="name@s-food.com"
          autocomplete="email"
          oninput="onEmailChange()"
          onkeydown="if(event.key==='Enter')doSendOtp()"
        />
        <div class="form-hint">@s-food.com 이메일 주소만 허용됩니다</div>
      </div>

      <button class="primary-btn" id="send-btn" onclick="doSendOtp()" disabled>
        <svg style="width:14px;height:14px;flex-shrink:0" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><line x1="2" y1="8" x2="13" y2="8"/><polyline points="9,4 13,8 9,12"/></svg>
        인증 코드 발송
      </button>
    </div>

    <!-- ── STEP 2: OTP 입력 ── -->
    <div class="section" id="sec2">
      <div class="ok-box show" id="ok2">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="8" cy="8" r="6"/><polyline points="5.5,8 7,9.5 10.5,6"/></svg>
        <span id="ok2-text"></span>
      </div>
      <div class="err-box" id="err2">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="8" cy="8" r="6"/><line x1="8" y1="5.5" x2="8" y2="8.5"/><circle cx="8" cy="11" r=".6" fill="currentColor" stroke="none"/></svg>
        <span id="err2-text"></span>
      </div>

      <div class="form-row">
        <label for="otp">인증번호 6자리</label>
        <input
          type="text" id="otp"
          class="otp-input"
          placeholder="000000"
          maxlength="6"
          inputmode="numeric"
          autocomplete="one-time-code"
          oninput="onOtpChange(this)"
          onkeydown="if(event.key==='Enter')doVerifyOtp()"
        />
      </div>

      <div class="timer-row">
        <div class="timer-label">유효 시간 <span class="timer-val" id="timer">5:00</span></div>
        <button class="resend-btn" id="resend-btn" onclick="doResend()" disabled>재발송</button>
      </div>

      <button class="primary-btn" id="verify-btn" onclick="doVerifyOtp()" disabled>
        <svg style="width:14px;height:14px;flex-shrink:0" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><polyline points="2.5,8 6,11.5 13.5,4.5"/></svg>
        로그인
      </button>

      <div class="back-row">
        <button class="back-btn" onclick="goBack()">
          <svg style="width:11px;height:11px" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><polyline points="10,3 5,8 10,13"/></svg>
          이메일 다시 입력
        </button>
      </div>
    </div>

    <div class="card-footer">
      접근 권한 문의 · IT팀 담당자에게 연락해주세요
    </div>
  </div>
</main>

<div class="toast" id="toast"></div>

<script>
// ── 상태 ─────────────────────────────────────────────────
let otpKey = '';        // verificationKey (백엔드 응답)
let timerSec = 300;     // 5분
let timerRef = null;
let resendCooldownRef = null;
let resendSec = 60;

// ── 이메일 입력 ───────────────────────────────────────────
function onEmailChange() {
  const v = document.getElementById('email').value.trim();
  document.getElementById('send-btn').disabled = !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v);
  hideErr('err1');
}

// ── OTP 입력 ──────────────────────────────────────────────
function onOtpChange(el) {
  el.value = el.value.replace(/\D/g, '').slice(0, 6);
  document.getElementById('verify-btn').disabled = el.value.length !== 6;
  hideErr('err2');
}

// ── STEP 1 → API 호출: OTP 발송 ──────────────────────────
async function doSendOtp() {
  const email = document.getElementById('email').value.trim().toLowerCase();
  if (!email) return;

  setBtnLoading('send-btn', true);
  hideErr('err1');

  try {
    /* ── 실제 연동 시 아래 주석 해제 ──
    const res = await fetch('/api/auth/otp/request', {
      method: 'POST',
      credentials: 'include',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email })
    });
    const data = await res.json();

    if (!res.ok) {
      const msg = getErrMsg1(res.status);
      showErr('err1', msg);
      return;
    }
    otpKey = data.otpKey;  // 백엔드 응답 필드명 확인 필요
    ── 목업에서는 아래로 동작 ── */
    await fakeDelay(900);
    otpKey = 'mock-verification-key-' + Date.now();
    // ──────────────────────────────

    goToStep2(email);

  } catch {
    showErr('err1', '네트워크 오류가 발생했어요. 다시 시도해주세요.');
  } finally {
    setBtnLoading('send-btn', false);
  }
}

// ── STEP 2 진입 ───────────────────────────────────────────
function goToStep2(email) {
  // 인디케이터 갱신
  document.getElementById('step1-ind').classList.remove('active');
  document.getElementById('step1-ind').classList.add('done');
  document.getElementById('dot1').innerHTML = '✓';
  document.getElementById('step2-ind').classList.add('active');

  // 섹션 전환
  document.getElementById('sec1').classList.remove('active');
  document.getElementById('sec2').classList.add('active');

  // 성공 메시지
  document.getElementById('ok2-text').textContent =
    email + ' 으로 인증번호를 발송했어요';

  // OTP 입력 초기화 및 포커스
  const otpEl = document.getElementById('otp');
  otpEl.value = '';
  document.getElementById('verify-btn').disabled = true;
  setTimeout(() => otpEl.focus(), 80);

  // 타이머 시작
  startTimer();

  // 재발송 버튼 쿨다운
  startResendCooldown();
}

// ── STEP 2 → API 호출: OTP 검증 ──────────────────────────
async function doVerifyOtp() {
  const code = document.getElementById('otp').value.trim();
  if (code.length !== 6) return;

  setBtnLoading('verify-btn', true);
  hideErr('err2');

  try {
    /* ── 실제 연동 시 아래 주석 해제 ──
    const res = await fetch('/api/auth/otp/verify', {
      method: 'POST',
      credentials: 'include',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ otpKey, otpCode: code })
    });
    const data = await res.json();

    if (!res.ok || !data.verified) {
      showErr('err2', getErrMsg2(res.status, data));
      return;
    }
    window.location.href = '/';
    ── 목업에서는 아래로 동작 ── */
    await fakeDelay(900);
    if (code === '000000') {
      // 틀린 코드 시뮬레이션
      showErr('err2', '인증번호가 일치하지 않아요. 다시 확인해주세요.');
      document.getElementById('otp').value = '';
      document.getElementById('verify-btn').disabled = true;
      return;
    }
    stopTimer();
    toast('인증 완료! 메인 화면으로 이동합니다.', false);
    setTimeout(() => { /* window.location.href = '/'; */ }, 1200);
    // ──────────────────────────────

  } catch {
    showErr('err2', '네트워크 오류가 발생했어요. 다시 시도해주세요.');
  } finally {
    setBtnLoading('verify-btn', false);
  }
}

// ── 재발송 ────────────────────────────────────────────────
async function doResend() {
  const email = document.getElementById('email').value.trim().toLowerCase();

  document.getElementById('resend-btn').disabled = true;
  hideErr('err2');
  stopTimer();
  timerSec = 300;

  try {
    /* ── 실제 연동 시 아래 주석 해제 ──
    const res = await fetch('/api/auth/otp/request', {
      method: 'POST',
      credentials: 'include',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email })
    });
    if (!res.ok) { toast('재발송에 실패했어요.', true); return; }
    const data = await res.json();
    otpKey = data.otpKey;
    ── 목업에서는 아래로 동작 ── */
    await fakeDelay(600);
    otpKey = 'mock-verification-key-resend-' + Date.now();
    // ──────────────────────────────

    document.getElementById('otp').value = '';
    document.getElementById('verify-btn').disabled = true;
    document.getElementById('ok2-text').textContent =
      email + ' 으로 인증번호를 재발송했어요';
    toast('인증번호를 재발송했어요.', false);
    startTimer();
    startResendCooldown();

  } catch {
    toast('재발송 중 오류가 발생했어요.', true);
    document.getElementById('resend-btn').disabled = false;
  }
}

// ── 이전으로 ─────────────────────────────────────────────
function goBack() {
  stopTimer();
  clearTimeout(resendCooldownRef);

  document.getElementById('step1-ind').classList.add('active');
  document.getElementById('step1-ind').classList.remove('done');
  document.getElementById('dot1').textContent = '1';
  document.getElementById('step2-ind').classList.remove('active');

  document.getElementById('sec2').classList.remove('active');
  document.getElementById('sec1').classList.add('active');
  hideErr('err1');

  setTimeout(() => document.getElementById('email').focus(), 80);
}

// ── 타이머 ────────────────────────────────────────────────
function startTimer() {
  timerSec = 300;
  updateTimerDisplay();
  timerRef = setInterval(() => {
    timerSec--;
    updateTimerDisplay();
    if (timerSec <= 0) {
      stopTimer();
      showErr('err2', '인증번호가 만료됐어요. 재발송 버튼을 눌러주세요.');
      document.getElementById('verify-btn').disabled = true;
    }
  }, 1000);
}

function stopTimer() {
  clearInterval(timerRef);
  timerRef = null;
}

function updateTimerDisplay() {
  const m = Math.floor(timerSec / 60);
  const s = String(timerSec % 60).padStart(2, '0');
  const el = document.getElementById('timer');
  el.textContent = m + ':' + s;
  el.className = 'timer-val' + (timerSec <= 60 ? ' warn' : '');
}

// ── 재발송 쿨다운 (60초) ─────────────────────────────────
function startResendCooldown() {
  let sec = 60;
  const btn = document.getElementById('resend-btn');
  btn.disabled = true;
  btn.textContent = '재발송 (' + sec + '초)';

  resendCooldownRef = setInterval(() => {
    sec--;
    if (sec <= 0) {
      clearInterval(resendCooldownRef);
      btn.disabled = false;
      btn.textContent = '재발송';
    } else {
      btn.textContent = '재발송 (' + sec + '초)';
    }
  }, 1000);
}

// ── 에러/성공 표시 유틸 ───────────────────────────────────
function showErr(id, msg) {
  const el = document.getElementById(id);
  document.getElementById(id + '-text').textContent = msg;
  el.classList.add('show');
}
function hideErr(id) {
  document.getElementById(id).classList.remove('show');
}

// ── 버튼 로딩 상태 ───────────────────────────────────────
function setBtnLoading(id, on) {
  const btn = document.getElementById(id);
  btn.disabled = on;
  btn.classList.toggle('loading', on);
  if (on) {
    btn.dataset.orig = btn.innerHTML;
    btn.innerHTML = `<svg class="spin" style="width:14px;height:14px" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><circle cx="8" cy="8" r="6" stroke-opacity=".25"/><path d="M8 2a6 6 0 0 1 6 6"/></svg> 처리 중...`;
  } else {
    if (btn.dataset.orig) btn.innerHTML = btn.dataset.orig;
  }
}

// ── 에러 메시지 매핑 ─────────────────────────────────────
function getErrMsg1(status) {
  const map = {
    400: '이메일 형식이 올바르지 않거나 허용되지 않는 도메인이에요.',

// ── 토스트 ────────────────────────────────────────────────
let toastT;
function toast(msg, isErr) {
  clearTimeout(toastT);
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast' + (isErr ? ' err' : '');
  requestAnimationFrame(() => el.classList.add('show'));
  toastT = setTimeout(() => el.classList.remove('show'), isErr ? 6000 : 2500);
}

// ── 목업 전용 딜레이 ─────────────────────────────────────
function fakeDelay(ms) {
  return new Promise(r => setTimeout(r, ms));
}
