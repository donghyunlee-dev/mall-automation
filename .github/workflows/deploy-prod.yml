name: Deploy Production

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/deploy-prod.yml"

concurrency:
  group: backend-deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: ap-northeast-2
  AWS_MAX_ATTEMPTS: 10
  AWS_RETRY_MODE: standard
  BACKEND_ARTIFACT_S3_URI: s3://sfood-mall-automation-prod-055043225767-ap-northeast-2-an/app/deploy/sfood-mall-automation-backend.jar

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Build jar
        working-directory: backend
        run: ./gradlew clean bootJar --no-daemon

      - name: Select boot jar
        working-directory: backend
        run: |
          JAR_PATH="$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-plain.jar' | head -n 1)"
          if [ -z "$JAR_PATH" ]; then
            echo "Boot jar not found" >&2
            exit 1
          fi
          echo "JAR_PATH=backend/$JAR_PATH" >> "$GITHUB_ENV"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload jar to S3
        run: |
          aws configure set default.s3.multipart_threshold 128MB
          aws configure set default.s3.multipart_chunksize 128MB
          aws configure set default.s3.max_concurrent_requests 1
          aws s3 cp "$JAR_PATH" "$BACKEND_ARTIFACT_S3_URI" --no-progress --cli-read-timeout 0 --cli-connect-timeout 60
          echo "Uploaded backend jar to $BACKEND_ARTIFACT_S3_URI"
